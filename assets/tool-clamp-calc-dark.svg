<svg xmlns="http://www.w3.org/2000/svg" width="840" height="120" viewBox="0 0 840 120" role="img" aria-label="トグルクランプ締圧力計算機：下方押え型トグルクランプのリンク寸法から、ハンドル角ごとの締圧力とハンドル操作力を計算。死点越えのロック時の締圧力、スピンドル位置に合わせたカタログ値の換算にも対応">
