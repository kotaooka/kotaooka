<svg xmlns="http://www.w3.org/2000/svg" width="840" height="120" viewBox="0 0 840 120" role="img" aria-label="自動車ローン計算機：月々の支払額と利息の合計、払える月額から借りられる額を計算。残価設定・ボーナス併用、繰上げ返済、変動金利の上昇を比較。銀行・ディーラーの金利の例にも対応">
<rect x=".5" y=".5" width="839" height="119" rx="10" fill="#ffffff" stroke="#d5dce3"/>
<style>
.drift{animation:drift linear infinite}
@keyframes drift{to{transform:translate(var(--c),var(--c))}}
