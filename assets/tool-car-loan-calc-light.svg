.n{display:none}
@media (max-width: 600px){.w{display:none}.n{display:inline}}
.glint{animation:glint 5s 0.0s ease-in-out infinite;opacity:0}
@keyframes glint{0%{transform:translateY(-40px);opacity:0}8%{opacity:1}30%{transform:translateY(120px);opacity:0}100%{transform:translateY(120px);opacity:0}}
</style>
