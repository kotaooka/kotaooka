<svg xmlns="http://www.w3.org/2000/svg" width="840" height="120" viewBox="0 0 840 120" role="img" aria-label="はめあい・ねじ公差計算機：穴と軸、めねじとおねじの公差域を図示し、すきま・しめしろを計算。塗装・めっきの膜厚で何µm干渉するか、何µmまで塗れるかを求め、ねじはボルトとナットの断面で確認">
